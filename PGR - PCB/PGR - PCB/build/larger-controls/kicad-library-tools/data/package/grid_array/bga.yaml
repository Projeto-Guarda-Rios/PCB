  ball_type: 'collapsible'
  pitch: 0.5
  layout_y: 27
  layout_x: 27
  area_skips: [[d,4,ad,24]]
  pad_skips: [
  # bottom cutouts
    A4, B4, A5, A8, B8, A9, A12, B12, A13, A16, B16, A17, A20, B20, A21, A24, B24, A25,
  # top cutouts
    AG3, AG4, AF4, AG7, AG8, AF8, AG11, AG12, AF12, AG15, AG16, AF16, AG19, AG20, AF20, AG23, AG24, AF24,
  # left cutouts
    C1, D1, D2, G1, H1, H2, L1, M1, M2, R1, T1, T2, W1, Y1, Y2, AC1, AD1, AD2,
  # right cutouts
    D26, D27, E27, H26, H27, J27, M26, M27, N27, T26, T27, U27, Y26, Y27, AA27, AD26, AD27, AE27
  ]
  mask_margin: 0.050
  paste_margin: 0.000001
