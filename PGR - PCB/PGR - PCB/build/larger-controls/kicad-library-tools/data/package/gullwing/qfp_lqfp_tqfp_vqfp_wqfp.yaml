# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/Gullwing

# QFP - Quad Flat Package (Gullwing leads)
#
# This file cointains JEDEC QFP and JEITA/EIAJ P-QFP packages
#
# JEDEC standards: MS-022, MS-026, MS-029, MO-069, MO-071, MO-082, MO-084, MO-086, MO-089, MO-108, MO-112, MO-188, MO-189, MO-204, and others
# JEITA standards: ED-7311A, ED-7311-12, EDR-7311A

default_parameters:
  device_type: 'PQFP'
  library_Suffix: 'QFP'

##############################################################################
# PQFP, height > 1.70 mm
##############################################################################

PQFP-44_10x10mm_P0.8mm:
# replaces handmade PQFP-44_10x10mm_P0.8mm
  size_source: 'JEDEC MS-022 variation AB, https://www.jedec.org/document_search?search_api_views_fulltext=MS-022, https://ww1.microchip.com/downloads/aemDocuments/documents/package-outline-drawings/c04-21291a.pdf'
  # handmade footprint was using http://www.onsemi.com/pub/Collateral/122BK.PDF, but it has height = 2.8 mm max (out of standard)
  # one more source: https://datasheet.octopart.com/AT86RF233-ZU-Atmel-datasheet-22122754.pdf#page=22
  compatible_mpns:
    - 'P-QFP'
    - 'QQZ' # Microchip
    - 'M44-2 44L-MQFP-10x10x2mm' # Maxim / Analog Devices, # https://www.analog.com/media/en/package-pcb-resources/package/pkg_pdf/mqfp/21-0826.pdf
  device_type: 'PQFP'
  body_size_x: 10.00
  body_size_y: 10.00
  body_height: 1.80 .. 2.00 .. 2.20
  overall_height:
    maximum: 2.45
  body_pcb_gap: 0.00 .. 0.25
  overall_size_x: 13.20
  overall_size_y: 13.20
  lead_width: 0.29 .. 0.45
  lead_len: 0.73 .. 0.88 .. 1.03
  lead_height: 0.11 .. 0.23
  pitch: 0.80
  num_pins_x: 11
  num_pins_y: 11

Microchip_PQFP-44_10x10mm_P0.8mm:
# Similar to JEDEC MO-112, variation AA-2, it's actually QFP / PQFP
# It's replacing MQFP-44_10x10mm_P0.8mm, used only by symbol AD7722
  size_source:
    - url: 'JEDEC MO-112 variation AA-2, Microchip and Analog Devices'
    - url: 'https://www.jedec.org/document_search?search_api_views_fulltext=MO-112'
    - url: 'https://ww1.microchip.com/downloads/aemDocuments/documents/OTH/ProductDocuments/DataSheets/20005418B.pdf'
      page: 10
    - url: 'https://www.analog.com/media/en/technical-documentation/data-sheets/ad7722.pdf'
      page: 23
  # one more source: https://www.analog.com/media/en/technical-documentation/data-sheets/ad7864.pdf#page=27
  # similar sizes: https://ww1.microchip.com/downloads/aemDocuments/documents/package-outline-drawings/c04-00119a.pdf
  compatible_mpns:
    - 'P-QFP'
    - '44-Lead-MQFP S-44-2' # Analog Devices
  device_type: 'PQFP'
  manufacturer: 'Microchip'
  body_size_x: 9.80 .. 10.00 .. 10.20 # minimum and maximum from Microchip / Analog Devices
  body_size_y: 9.80 .. 10.00 .. 10.20
  body_height: 1.95 .. 2.00 .. 2.20  # maximum height from Analog Devices, Microchip and JEDEC is 2.1 mm
  body_pcb_gap: 0.00 .. 0.25
  overall_size_x: 13.65 .. 13.90 .. 14.15 # minimum and maximum from Microchip / Analog Devices
  overall_size_y: 13.65 .. 13.90 .. 14.15
  lead_width: 0.30 .. 0.45
  lead_len: 0.73 .. 0.88 .. 1.03
  lead_height: 0.11 .. 0.23
  pitch: 0.80
  num_pins_x: 11
  num_pins_y: 11

PQFP-64_14x14mm_P0.8mm:
# Similar to JEITA 64-001-EB, as well JEDEC MS-022 variation BE
  size_source: 'https://www.renesas.com/us/en/document/psc/package-drawing-qfp-64pin-prqp0064gb'
  device_type: 'PQFP'
  body_size_x:
    nominal: 14
  body_size_y:
    nominal: 14
  overall_height:
    maximum: 3.05 # JEITA has A = 3.15 mm max
  overall_size_x:
    minimum: 16.9
    nominal: 17.2
    maximum: 17.5
  overall_size_y:
    minimum: 16.9
    nominal: 17.2
    maximum: 17.5
  lead_width:
    minimum: 0.29
    nominal: 0.37
    maximum: 0.45
  lead_len: # JEITA has Lp = 0.73 .. 1.03 mm
    minimum: 0.5
    nominal: 0.8
    maximum: 1.1
  pitch: 0.8
  num_pins_x: 16
  num_pins_y: 16

PQFP-80_14x20mm_P0.8mm:
# replacing hand-made footprint, it was using suggested land-patten from Onsemi
  size_source: 'JEITA/EIAJ ED-7311A (variation 80-001-PB) / JEDEC MS-022 (variation GB-2), 2.70mm body thickness, https://www.jeita.or.jp/japanese/standard/book/ED-7311A/#target/page_no=91, https://www.jedec.org/document_search?search_api_views_fulltext=MS-022'
  compatible_mpns:
    - 'P-QFP080-14.00x20.00-0.80' # JEITA external type
    - 'P-QFP080-1420-0.80' # EIAJ old description
    - 'MQFP-80' # JEDEC 'metric'
    - 'Onsemi_PQFP80-14x20-/-QIP80E Onsemi_CASE-122BS' # it differs a little in some sizes, overall_height for example is 3.0mm max, but generated footprint is compatible, https://www.onsemi.com/pub/Collateral/122BS.PDF
  device_type: 'PQFP'
  body_size_x: 14.00 # JEITA D / JEDEC D1
  body_size_y: 20.00 # JEITA E / JEDEC E1
  body_height: 2.50 .. 2.70 .. 2.90
  overall_height: 2.50 .. 2.80 .. 3.15 # minimum: JEITA A1_min + A2_min; nominal: JEITA A1_nom + A2_nom; maximum: JEITA A_max
  body_pcb_gap: 0.00 .. 0.25
  overall_size_x: 17.20 # JEITA HD / JEDEC D, JEITA document swap these sizes but it's probably a typo
  overall_size_y: 23.20 # JEITA HE / JEDEC E
  lead_width: 0.29 .. 0.45 # JEITA bp / JEDEC b
  lead_len: 0.73 .. 0.88 .. 1.03 # JEITA Lp; nominal value from JEDEC L
  lead_height: 0.11 .. 0.23
  pitch: 0.80 # e
  num_pins_x: 16
  num_pins_y: 24

Hitachi_FP80B_PQFP-80_14x20mm_P0.8mm:
  inherit: PQFP-80_14x20mm_P0.8mm
  size_source:
    - url: 'Hitachi FP-80B, 2.70mm body thickness'
    - url: 'https://www.icbase.com/pdf/HTH/HTH14270106.pdf'
      page: 9
    - url: 'https://bitsavers.trailing-edge.com/components/hitachi/_dataBooks/1994_M24T026_Hitachi_LCD_Controller_Driver_LSI_Data_Book.pdf'
      page: 28
  compatible_mpns:
    - 'Hitachi_FP-80B'
  manufacturer: 'Hitachi'
  part_number: 'FP80B' # there's a 'FP-80' (older package) which has even bigger overall_size_x/y and lead_len
  overall_size_x: 18.8 +/- 0.4
  overall_size_y: 24.8 +/- 0.4
  lead_len: 1.2 +/- 0.2

PQFP-128_28x28mm_P0.8mm:
  size_source: 'JEITA/EIAJ ED-7311A (variation 128-001-KD) / JEDEC MS-022 (variation DB-2), 3.40mm body thickness, https://www.jeita.or.jp/japanese/standard/book/ED-7311A/#target/page_no=78, https://www.jedec.org/document_search?search_api_views_fulltext=MS-022'
  compatible_mpns:
    - 'P-QFP128-28.00x28.00-0.80' # JEITA external type
    - 'P-QFP128-2828-0.80' # EIAJ old description
    - 'MQFP-128' # JEDEC 'metric'
  device_type: 'PQFP'
  body_size_x: 28.00 # JEITA D / JEDEC D1
  body_size_y: 28.00 # JEITA E / JEDEC E1
  overall_height: 3.20 .. 3.50 .. 3.85 # minimum: JEITA A1_min + A2_min; nominal: JEITA A1_nom + A2_nom; maximum: JEITA A_max
  body_pcb_gap:
    nominal: 0.25
  overall_size_x: 31.20 # JEITA HD / JEDEC D
  overall_size_y: 31.20 # JEITA HE / JEDEC E
  lead_width: 0.29 .. 0.45 # JEITA bp / JEDEC b
  lead_len: 0.73 .. 0.88 .. 1.03 # JEITA Lp; nominal value from JEDEC L
  lead_height: 0.11 .. 0.23
  pitch: 0.80 # e
  num_pins_x: 32
  num_pins_y: 32

MO112AC1_PQFP-52_10x10mm_P0.65mm:
  size_source: 'JEDEC MO-112 variation AC-1, https://www.jedec.org/document_search?search_api_views_fulltext=MO-112, https://www.analog.com/media/en/package-pcb-resources/package/32717196300961s_52_2.pdf'
