  size_source: 'JEITA/EIAJ ED-7311A (variation 64-001-TCA) / JEDEC MS-026 (variation ACD), 1.00mm body thickness, https://www.jeita.or.jp/japanese/standard/book/ED-7311A/#target/page_no=30, https://www.jedec.org/document_search?search_api_views_fulltext=MS-026'
  compatible_mpns:
    - 'P-TQFP064-10.00x10.00-0.50' # JEITA external type
    - 'P-TQFP064-1010-0.50' # EIAJ old description
  device_type: 'TQFP'
  body_size_x: 10.00 # JEITA D / JEDEC D1
  body_size_y: 10.00 # JEITA E / JEDEC E1
  body_height: 0.95 .. 1.00 .. 1.05
  overall_height: 1.00 .. 1.10 .. 1.20 # minimum: JEITA A1_min + A2_min; nominal: JEITA A1_nom + A2_nom; maximum: JEITA A_max
  body_pcb_gap: 0.05 .. 0.15
  overall_size_x: 12.00 # JEITA HD / JEDEC D
  overall_size_y: 12.00 # JEITA HE / JEDEC E
  lead_width: 0.17 .. 0.22 .. 0.27 # JEITA bp; nominal value from JEDEC b
  lead_len: 0.45 .. 0.60 .. 0.75 # JEITA Lp; nominal value from JEDEC L
  lead_height: 0.09 .. 0.20
  pitch: 0.50 # e
  num_pins_x: 16
  num_pins_y: 16

Texas_TQFP-64-1EP_10x10mm_P0.5mm_EP8x8mm_Mask4.44x4.44mm:
  inherit: TQFP-64_10x10mm_P0.5mm
  size_source:
    - url: 'Texas PAP0064M, based on JEDEC MS-026 variation ACD, 1.00mm body thickness'
    - url: 'https://www.ti.com/lit/ml/pptd078j/pptd078j.pdf'
    - url: 'https://www.ti.com/lit/ds/symlink/tusb4041i.pdf'
      page: 40
  compatible_mpns:
    - 'Texas_PAP0064M Texas_PowerPAD-64-pin-HTQFP'
  manufacturer: 'Texas'
  # part_number: 'PAP0064M'
  body_size_x: 9.8 .. 10.2
  body_size_y: 9.8 .. 10.2
  overall_size_x: 11.8 .. 12.2
  overall_size_y: 11.8 .. 12.2
  EP_size_x: 3.64 .. 4.44 # Exposed Pad from Texas package
  EP_size_y: 3.64 .. 4.44
  EP_num_paste_pads: [2, 2] # https://www.ti.com/lit/an/sloa122/sloa122.pdf#page=5
  EP_mask_x: 4.44 # sizes based on Texas Board Layout example
  EP_mask_y: 4.44 # sizes based on Texas Board Layout example
  EP_size_x_overwrite: 8 # sizes based on Texas Board Layout example
  EP_size_y_overwrite: 8 # sizes based on Texas Board Layout example
  thermal_vias:
    count: [8, 8]
    drill: 0.2
    grid: [1, 1]
    EP_num_paste_pads: [2, 2]

