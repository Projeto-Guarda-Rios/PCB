TQFP-176_24x24mm_P0.5mm:
# Manufacturer calls it 'TQ176' and says it's based on MS-026 VAR BCA ('C' here is probably a typo),
# but take a look at JEDEC MS-026 variation BGA (E1 and D1 sizes), this is actually LQFP (height A = 1.60 mm max)
# 3D model has height = 1.60mm, and there's already a LQFP with these sizes,
# we should change 'size_source' to match MS-026 variation AGA (TQFP, height A = 1.20mm) and fix the 3D model
  size_source: 'http://www.microsemi.com/index.php?option=com_docman&task=doc_download&gid=131095'
  device_type: 'TQFP'
  body_size_x:
    nominal: 24
  body_size_y:
    nominal: 24
  body_height: 0.95 .. 1.00 .. 1.05
  body_pcb_gap: 0.05 .. 0.15
  overall_size_x:
    nominal: 26
  overall_size_y:
    nominal: 26
  lead_width:
    minimum: 0.17
    maximum: 0.27
  lead_len:
    minimum: 0.45
    maximum: 0.75
  lead_height: 0.09 .. 0.20
  pitch: 0.5
  num_pins_x: 44
  num_pins_y: 44

