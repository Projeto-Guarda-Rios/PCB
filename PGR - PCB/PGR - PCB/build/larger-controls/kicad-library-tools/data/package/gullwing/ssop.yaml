  additional_tags:
    - "SOIC-10 NB"
  custom_name_format: SOIC-{pincount}_{size_x:.2g}x{size_y:.2g}mm_P{pitch:.3g}mm
  device_type: 'SOIC' # temporary
  body_size_x:
    minimum: 3.8
    maximum: 4.0
  body_size_y:
    minimum: 4.8
    maximum: 5.0
  overall_height:
    minimum: 1.25
    maximum: 1.75
  overall_size_x:
    minimum: 5.8
    maximum: 6.2
  lead_width:
    minimum: 0.31
    maximum: 0.51
  lead_len:
    minimum: 0.4
    maximum: 0.8
  pitch: 1.00
  num_pins_x: 0
  num_pins_y: 5

