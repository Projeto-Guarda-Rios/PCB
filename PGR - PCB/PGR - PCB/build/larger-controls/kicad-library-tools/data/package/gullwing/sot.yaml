  custom_name_format: 'SOT-23-3'
  body_size_x: 1.6
  body_size_y: 2.9
  body_height: 0.9 .. 1.15 .. 1.30
  body_pcb_gap: 0 .. 0.15
  overall_size_x: 2.8
  lead_width: 0.3 .. 0.5
  lead_len: 0.3 .. 0.45 .. 0.6
  lead_height: 0.08 .. 0.22
  pitch: 0.95
  num_pins_x: 0
  num_pins_y: 3
  deleted_pins: [2, 4, 6]

