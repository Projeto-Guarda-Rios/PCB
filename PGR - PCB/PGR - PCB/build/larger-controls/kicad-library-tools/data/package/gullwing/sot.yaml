  body_size_x: 1.20 .. 1.30 .. 1.40
  body_size_y: 2.8 .. 2.9 .. 3.04
  body_height: 0.70 .. 0.85 .. 1.02
  body_pcb_gap: 0.05 .. 0.15
  overall_size_x: 2.10 .. 2.64
  lead_width: 0.3 .. 0.5
  lead_len: 0.40 .. 0.50 .. 0.6
  lead_height: 0.08 .. 0.20
  pitch: 0.95
  num_pins_x: 0
  num_pins_y: 3
  deleted_pins: [2, 4, 6]

