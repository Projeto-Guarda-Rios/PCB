# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/Gullwing

default_parameters:
  device_type: 'SO'
  override_lib_name: 'Sensor_Pressure'

CFSensor_XGZP6859D:
  size_source: 'https://cfsensor.com/wp-content/uploads/2022/11/XGZP6859D-Pressure-Sensor-V2.5.pdf'
  # Note: Alternate datasheet source: https://www.lcsc.com/datasheet/lcsc_datasheet_2206301715_Sencoch-Semiconductor-GZP6859D201KPP_C3038050.pdf
  custom_name_format: '{man}_{mpn:s}_{size_x:g}x{size_y:g}mm'
  manufacturer: CFSensor
  part_number: XGZP6859D
  body_size_x: # from JEDEC
    nominal: 7.0
    tolerance: 0.1 # guess
  body_size_y:
    nominal: 7.0
    tolerance: 0.1 # guess
  overall_height: # Excluding pressure port
    nominal: 3.5 # 9.5-6.0
    tolerance: 0.1 # guess
  overall_size_x:
    nominal: 10.6
    tolerance: 0.2 # guess
  lead_width:
    nominal: 0.8
    tolerance: 0.1 # guess
  lead_len:
    nominal: 1.8 # (10.6-7)/2
    tolerance: 0.1 # guess
  pitch: 2.54
  num_pins_x: 0
  num_pins_y: 3
  additional_drawings: # This is a pressure sensor, draw the port OD/ID
    port_inner:
      type: circle
      layer: mechanical
      center: [0, 0]
      diameter: 3.0
    port_outer:
      inherit: port_inner
      diameter: 1.0
