# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

QFN-72-1EP_10x10mm_P0.5mm_EP6x6mm:
  size_source:
    url: 'http://ww1.microchip.com/downloads/en/DeviceDoc/00001682C.pdf'
    page: 70
  device_type: 'QFN'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 9.9
    nominal: 10.0
    maximum: 10.1
  body_size_y:
    minimum: 9.9
    nominal: 10.0
    maximum: 10.1
  overall_height:
    minimum: 0.8
    nominal: 0.85
    maximum: 1.0
  num_pins_x: 18
  num_pins_y: 18
  pitch: 0.5
  lead_width:
    minimum: 0.18
    nominal: 0.25
    maximum: 0.30
  lead_len:
    minimum: 0.3
    nominal: 0.4
    maximum: 0.5
  EP_size_x:
    minimum: 5.9
    nominal: 6.0
    maximum: 6.1
  EP_size_y:
    minimum: 5.9
    nominal: 6.0
    maximum: 6.1
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [6, 6]
    drill: 0.2
    EP_num_paste_pads: [5, 5]
    EP_paste_coverage: 0.6
    paste_via_clearance: 0.1

QFN-76-1EP_9x9mm_P0.4mm_EP3.8x3.8mm:
  size_source:
    url: 'https://www.marvell.com/documents/bqcwxsoiqfjkcjdjhkvc/'
    page: 19
  device_type: 'QFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 9
    tolerance: 0
  body_size_y:
    nominal: 9
    tolerance: 0
  body_pcb_gap: 0.0 .. 0.02 .. 0.05
  overall_height:
    minimum: 0.8
    nominal: 0.85
    maximum: 1
  num_pins_x: 19
  num_pins_y: 19
  pitch: 0.4
  lead_shape: rounded
  lead_width:
    minimum: 0.15
    nominal: 0.2
    maximum: 0.25
  lead_len:
    nominal: 0.4
    tolerance: 0.1
  lead_height:
    nominal: 0.2
  EP_size_x:
    nominal: 3.8
    tolerance: 0.2
  EP_size_y:
    nominal: 3.8
    tolerance: 0.2
  EP_chamfer: 0.4
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [3, 3]
    grid: [1.2, 1.2]
    drill: 0.2
    paste_via_clearance: 0.1
    paste_avoid_via: True
    paste_between_vias: 1
    paste_rings_outside: 1

QFN-76-1EP_9x9mm_P0.4mm_EP5.81x6.31mm:
  size_source:
    url: 'https://ftdichip.com/wp-content/uploads/2020/07/DS_FT600Q-FT601Q-IC-Datasheet.pdf'
    page: 27
  device_type: 'QFN'
  #manufacturer: 'FTDIChip'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 9
    tolerance: 0.1
  body_size_y:
    nominal: 9
    tolerance: 0.1
  body_pcb_gap: 0.0 .. 0.02 .. 0.05
  overall_height:
    nominal: 0.9
    tolerance: 0.1
  num_pins_x: 19
  num_pins_y: 19
  pitch: 0.4
  lead_shape: rounded
  lead_width:
    nominal: 0.2
    tolerance: 0.05
  lead_len:
    nominal: 0.4
    tolerance: 0.1
  lead_height:
    nominal: 0.2
  EP_size_x:
    nominal: 5.81
    tolerance: 0.25
  EP_size_y:
    nominal: 6.31
    tolerance: 0.25
  EP_chamfer: 0.35
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [ 3, 3 ]
    grid: [ 2.0, 2.25 ]
    drill: 0.2
    paste_via_clearance: 0.1
    paste_avoid_via: True
    paste_between_vias: 1
    paste_rings_outside: 1

##############################################################################
# 'CSP' / 'LFCSP' packages, these packages are actually QFN under
# manufacturers own names, this section is temporary
##############################################################################

LFCSP-72-1EP_10x10mm_Pitch0.5mm_EP5.3x5.3mm_ThermalVias:
# JEDEC MO-220, variation VNND-4 (but custom Analog Devices' Exposed Pad), it's VQFN
#
# Generates:
# - LFCSP-72-1EP_10x10mm_P0.5mm_EP5.3x5.3mm
# - LFCSP-72-1EP_10x10mm_P0.5mm_EP5.3x5.3mm_ThermalVias
#
  size_source: 'http://www.analog.com/media/en/technical-documentation/data-sheets/ADAU1452_1451_1450.pdf' # page 195
  library: Package_CSP
  device_type: 'LFCSP'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 9.9
    nominal: 10.0
    maximum: 10.1
  body_size_y:
    minimum: 9.9
    nominal: 10.0
    maximum: 10.1
  num_pins_x: 18
  num_pins_y: 18
  pitch: 0.5
  lead_width:
    minimum: 0.18
    nominal: 0.23
    maximum: 0.3
  lead_len:
    minimum: 0.3
    nominal: 0.4
    maximum: 0.5
  EP_size_x:
    minimum: 5.15
    nominal: 5.3
    maximum: 5.45
  EP_size_y:
    minimum: 5.15
    nominal: 5.3
    maximum: 5.45
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [4, 4]
    drill: 0.3
    EP_paste_coverage: 0.65
    paste_via_clearance: 0.1

##############################################################################
# Please do not place other QFN packages below here, temporary section
