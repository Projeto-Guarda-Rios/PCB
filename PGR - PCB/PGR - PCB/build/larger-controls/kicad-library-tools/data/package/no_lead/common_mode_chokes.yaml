# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

default_parameters:
  library: Inductor_SMD
  device_type: 'common-mode choke'

L_CommonModeChoke_TDK_ACM2520-2P:
  size_source: 'https://product.tdk.com/system/files/dam/doc/product/emc/emc/cmf_cmc/catalog/cmf_commercial_signal_acm2520_en.pdf'
  # To overwrite the manually generated footprint
  custom_name_format: 'L_CommonModeChoke_{man:s}_ACM2520-2P'
  manufacturer: 'TDK'
  body_size_x:
    nominal: 2.5
    tolerance: 0.2
  body_size_y:
    nominal: 2.0
    tolerance: 0.2
  overall_height:
    nominal: 1.2
    tolerance: 0.1
  num_pins_x: 0
  num_pins_y: 2
  pitch: 1.3 # from land pattern pitch
  lead_width: 0.35
  lead_len: 0.45
  lead_height: 0.85
  lead_center_to_center_x: 2.05 # 1.6+0.45
  # From recommended land pattern (see size_source)
  pad_width: 0.4
  pad_length: 0.8
  pad_center_to_center_x: 2.3 #1.5+0.8

L_CommonModeChoke_TDK_ACM2520-3P:
  inherit: L_CommonModeChoke_TDK_ACM2520-2P
  # To overwrite the manually generated footprint
  custom_name_format: 'L_CommonModeChoke_{man:s}_ACM2520-3P'
  num_pins_y: 3
  pitch: 0.65 # from land pattern pitch
  lead_width: 0.3
  # From recommended land pattern (see size_source)
  pad_width: 0.35

L_CommonModeChoke_TDK_ACM7060:
  size_source: 'https://product.tdk.com/system/files/dam/doc/product/emc/emc/cmf_cmc/catalog/cmf_commercial_power_acm7060_en.pdf'
  # To overwrite the manually generated footprint
  custom_name_format: 'L_CommonModeChoke_{man:s}_ACM7060'
  manufacturer: 'TDK'
  body_size_x:
    nominal: 7.0
    tolerance: 0.2
  body_size_y:
    nominal: 6.0
    tolerance: 0.2
  overall_height:
    maximum: 3.5
  num_pins_x: 0
  num_pins_y: 2
  pitch: 3.0 # (1.5+4.5)/2
  lead_width: 1.5 +/- 0.2
  lead_len: 1.5 +/- 0.2
  # From recommended land pattern (see size_source)
  pad_width: 1.5 # (4.5-1.5)/2
  pad_length: 2.5 # (9-4)/2
  pad_center_to_center_x: 6.5 # (9+4)/2

