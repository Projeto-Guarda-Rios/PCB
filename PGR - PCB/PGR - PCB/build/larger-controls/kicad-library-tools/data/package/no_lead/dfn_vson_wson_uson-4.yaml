# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

default_parameters:
  library: Package_SON # each entry will need this for now (pending move footprits from Package_DFN_QFN to Package_SON later)

##############################################################################
# Pitch 0.5 mm
##############################################################################

Texas_X2SON-4-1EP_1.1x1.4mm_P0.5mm_EP0.8x0.6mm:
  size_source:
    url: 'http://www.ti.com/lit/ds/symlink/drv5032.pdf'
    page: 28
  device_type: 'X2SON'
  manufacturer: 'Texas'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 1.05
    maximum: 1.15
  body_size_y:
    minimum: 1.35
    maximum: 1.45
  body_pcb_gap: 0.0 .. 0.05
  overall_height:
    maximum: 0.4
  num_pins_x: 2
  num_pins_y: 0
  pitch: 0.5
  lead_shape: square
  lead_width:
    minimum: 0.17
    maximum: 0.27
  lead_len:
    minimum: 0.15
    maximum: 0.25
  lead_height:
    nominal: 0.13
  pad_numbers:
    generator: 'ccw_dual'
    axis: 'x'
  EP_size_x:
    nominal: 0.8
    tolerance: 0.1
  EP_size_y:
    nominal: 0.6
    tolerance: 0.1
  EP_chamfer: 0.15
  EP_pin_number: 5
  EP_num_paste_pads: 1
  thermal_vias:
    count: 1
    grid: [1, 1]
    drill: 0.2
    EP_num_paste_pads: 1 # [2, 2]
    EP_paste_coverage: 0.75
    paste_via_clearance: 0.1
    paste_avoid_via: False

##############################################################################
# Unusual pitch (1.65 mm / 2.10 mm / 2.54 mm / 5.08 mm ...)
##############################################################################

CDFN-4_2x2.5mm_P1.65mm:
  library: Package_DFN_QFN # TEMPORARY
  size_source:
    url: https://ww1.microchip.com/downloads/aemDocuments/documents/TCG/ProductDocuments/DataSheets/DSC1001-3-4-1.8V-3.3V-Low-Power-Precision-CMOS-Oscillators-DS20005529.pdf
    page: 17
  compatible_mpns:
    - Microchip-DFN2520-4LD-PL-1
  device_type: CDFN
  body_size_x: 2.0 +/- 0.05
  body_size_y: 2.5 +/- 0.05
  overall_height: 0.85 +/- 0.05
  num_pins_x: 0
  num_pins_y: 2
  pitch: 1.65
  lead_width: 0.65 +/- 0.05
  lead_len: 0.65 +/- 0.05

CDFN-4_2.5x3.2mm_P2.1mm:
  library: Package_DFN_QFN # TEMPORARY
  size_source:
    url: https://ww1.microchip.com/downloads/aemDocuments/documents/TCG/ProductDocuments/DataSheets/DSC1001-3-4-1.8V-3.3V-Low-Power-Precision-CMOS-Oscillators-DS20005529.pdf
    page: 16
  compatible_mpns:
    - Microchip-DFN3225-4LD-PL-1
  device_type: CDFN
  body_size_x: 2.5 +/- 0.05
  body_size_y: 3.2 +/- 0.05
  overall_height: 0.85 +/- 0.05
  num_pins_x: 0
  num_pins_y: 2
  pitch: 2.10
  lead_width: 0.9 +/- 0.05
  lead_len: 0.8 +/- 0.05

CDFN-4_3.2x5mm_P2.54mm:
  library: Package_DFN_QFN # TEMPORARY
  size_source:
    url: https://ww1.microchip.com/downloads/aemDocuments/documents/TCG/ProductDocuments/DataSheets/DSC1001-3-4-1.8V-3.3V-Low-Power-Precision-CMOS-Oscillators-DS20005529.pdf
    page: 15
  compatible_mpns:
    - Microchip-DFN5032-4LD-PL-1
  device_type: CDFN
  body_size_x: 3.2 +/- 0.05
  body_size_y: 5.0 +/- 0.05
  overall_height: 0.85 +/- 0.05
  num_pins_x: 0
  num_pins_y: 2
  pitch: 2.54
  lead_width: 1.2 +/- 0.05
  lead_len: 1.0 +/- 0.05  # It's a pullback, but Microchip recommends a normal DFN land pattern style

DFN-4_5x7mm_P5.08mm:
  library: Package_DFN_QFN # TEMPORARY
  size_source:
    url: https://ww1.microchip.com/downloads/aemDocuments/documents/TCG/ProductDocuments/DataSheets/DSC1001-3-4-1.8V-3.3V-Low-Power-Precision-CMOS-Oscillators-DS20005529.pdf
    page: 14
  compatible_mpns:
    - Microchip-DFN75-4LD-PL-1
  device_type: DFN
  body_size_x: 5 +/- 0.10
  body_size_y: 7 +/- 0.10
  num_pins_x: 0
  num_pins_y: 2
  pitch: 5.08
  lead_width: 1.4 +/- 0.05
  lead_len: 1.2 +/- 0.10
  rule_areas:
    central_area:
      name: 'Keepout'
      layers: 'F.Cu'
      keepouts:
        vias: deny
        tracks: deny
        copperpour: deny
      shapes:
        - type: rect
          center: [0, 0]
          size: [$(3.5 + 0.1 + 0.2), $(2.2 + 0.1 + 0.2)]
