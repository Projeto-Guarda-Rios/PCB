# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# This file cointains QFN with special format or special lead distribution,
# like JEDEC MO-241 which resembles a SON / DFN package

default_parameters:
  library: Package_DFN_QFN

Balun_Johanson_0900FM15K0039:
  size_source: 'https://www.johansontechnology.com/datasheets/0900FM15K0039/0900FM15K0039.pdf'
  library: 'RF_Converter'
  custom_name_format: 'Balun_Johanson_0900FM15K0039'
  device_type: 'DFN'
  manufacturer: 'Johanson'
  part_number: '0900FM15K0039'
  body_size_x:
    nominal: 1.25
    tolerance: 0.1
  body_size_y:
    nominal: 2
    tolerance: 0.15
  overall_height: 0.8 +/- 0.1
  num_pins_x: 1
  num_pins_y: 4
  pitch: 0.50
  lead_shape: square
  lead_width:
    nominal: 0.25
    tolerance: 0.1
  lead_len:
    minimum: 0.05
    nominal: 0.2
    maximum: 0.225 # should be 0.3mm by specs, but 0.8mm between pads is required.
  lead_height: 0.9  # Needs to be faked to maximum height, is equal to overall_height
  EP_chamfer: 0.15
  marker_dx: 0.3
  marker_dy: 0.45

Balun_Johanson_0900PC15J0013:
  size_source: 'https://www.johansontechnology.com/datasheets/0900PC15J0013/0900PC15J0013.pdf'
  library: 'RF_Converter'
  custom_name_format: 'Balun_Johanson_0900PC15J0013'
  device_type: 'DFN'
  manufacturer: 'Johanson'
  part_number: '0900PC15J0013'
  body_size_x:
    nominal: 1.25
    tolerance: 0.2
  body_size_y:
    nominal: 2
    tolerance: 0.2
  overall_height:
    maximum: 1.0
  num_pins_x: 1
  num_pins_y: 4
  pitch: 0.50
  lead_shape: square
  lead_width:
    nominal: 0.25
    tolerance: 0.1
  lead_len:
    minimum: 0.05
    nominal: 0.15 # should be 0.2mm by specs, but 0.8mm between pads is required.
    maximum: 0.15 # should be 0.3mm by specs, but 0.8mm between pads is required.
  lead_height:
    maximum: 1.0
  EP_chamfer: 0.15
  marker_dx: 0.15
  marker_dy: 0.45

Texas_UQFN-8_1.5x1.5mm_P0.5mm:
  size_source: 'https://www.ti.com/lit/ml/mpqf207e/mpqf207e.pdf'
  device_type: 'UQFN'
  manufacturer: 'Texas'
  ipc_class: 'qfn'
  body_size_x: 1.45 .. 1.55
  body_size_y: 1.45 .. 1.55
  body_pcb_gap: 0.0 .. 0.05
  overall_height: 0.5 .. 0.6
  num_pins_x: 1
  num_pins_y: 3
  pitch: 0.5
  lead_shape: custom
  lead_shape_custom: [
    [
  # Pin 1 with chamfer
    [-0.625, -0.75],
    [-0.375, -0.75],
    [-0.375, -0.4],
    [-0.525, -0.4],
    [-0.625, -0.5],
    ],
    [
    [-0.1, -0.75],
    [0.1, -0.75],
    [0.1, -0.4],
    [-0.1, -0.4],
    ],
    [
    [0.625, -0.75],
    [0.375, -0.75],
    [0.375, -0.4],
    [0.625, -0.4],
    ],
    [
    [-0.75, -0.15],
    [-0.75, 0.15],
    [-0.35, 0.15],
    [-0.35, -0.15],
    ],
    [
    [0.625, 0.75],
    [0.375, 0.75],
    [0.375, 0.4],
    [0.625, 0.4],
    ],
    [
    [-0.1, 0.75],
    [0.1, 0.75],
    [0.1, 0.4],
    [-0.1, 0.4],
    ],
    [
    [-0.625, 0.75],
    [-0.375, 0.75],
    [-0.375, 0.4],
    [-0.625, 0.4],
    ],
    [
    [0.75, -0.15],
    [0.75, 0.15],
    [0.35, 0.15],
    [0.35, -0.15],
    ],
  ]
  lead_width: 0.15 .. 0.25  # These are the dimension of the smallest pins, 2 and 6.
  lead_len: 0.3 .. 0.4  # These are the dimension of the smallest pins, 2 and 6.
  lead_height:
    nominal: 0.12
  pad_overrides:
    1:
      size_increase: [null, 0.05]
    3:
      size_increase: [null, 0.05]
    5:
      size_increase: [null, 0.05]
    7:
      size_increase: [null, 0.05]
    4:
      size_increase: [0.1, 0.05]
    8:
      size_increase: [0.1, 0.05]
  EP_chamfer: 0.5

