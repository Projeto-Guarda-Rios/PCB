# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

QFN-100-1EP_12x12mm_P0.4mm_EP7.4x7.4mm:
  size_source:
    url: 'https://artinchip.com/upload/files/product/20240112/17050529177725663.pdf/'
    page: 44
  device_type: 'QFN'
  manufacturer: 'ArtInChip'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 12
    tolerance: 0.1
  body_size_y:
    nominal: 12
    tolerance: 0.1
  overall_height:
    minimum: 0.7
    nominal: 0.75
    maximum: 0.8
  num_pins_x: 25
  num_pins_y: 25
  pitch: 0.4
  lead_width:
    minimum: 0.15
    nominal: 0.20
    maximum: 0.25
  lead_len:
    minimum: 0.35
    nominal: 0.40
    maximum: 0.45
  EP_size_x:
    minimum: 7.30
    nominal: 7.40
    maximum: 7.50
  EP_size_y:
    minimum: 7.30
    nominal: 7.40
    maximum: 7.50
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [4, 4]
    drill: 0.2
    EP_paste_coverage: 0.6
    paste_via_clearance: 0.1

VQFN-100-1EP_12x12mm_P0.4mm_EP8x8mm:
  size_source: 'https://ww1.microchip.com/downloads/aemDocuments/documents/UNG/ProductDocuments/DataSheets/USB7206C-Data-Sheet-DS00003850.pdf'
  device_type: 'VQFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 12
  body_size_y:
    nominal: 12
  overall_height:
    minimum: 0.8
    nominal: 0.85
    maximum: 0.9
  num_pins_x: 25
  num_pins_y: 25
  pitch: 0.4
  lead_width:
    minimum: 0.15
    nominal: 0.2
    maximum: 0.25
  lead_len:
    minimum: 0.5
    nominal: 0.6
    maximum: 0.7
  EP_size_x:
    nominal: 8
    tolerance: 0.1
  EP_size_y:
    nominal: 8
    tolerance: 0.1
  EP_num_paste_pads: [4, 4]
  thermal_vias:
    count: [5, 5]
    drill: 0.2
    paste_via_clearance: 0.1
    paste_avoid_via: False
