# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

Renesas_UQFN-20_2x3mm_P0.4mm_LayoutBorder4x6y:
  size_source:
    - url: 'Renesas STQFN-20L'
    - url: 'https://www.renesas.com/en/document/dst/slg465808283-datasheet'
      page: 200
  device_type: 'UQFN'
  manufacturer: 'Renesas'
  suffix: '_LayoutBorder4x6y'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 1.95
    nominal: 2.00
    maximum: 2.05
  body_size_y:
    minimum: 2.95
    nominal: 3.00
    maximum: 3.05
  overall_height:
    minimum: 0.50
    nominal: 0.55
    maximum: 0.60
  num_pins_x: 4
  num_pins_y: 6
  pitch: 0.4
  lead_width:
    minimum: 0.13
    nominal: 0.18
    maximum: 0.23
  lead_len:
  # Proper values
  # minimum: 0.25
  # nominal: 0.30
  # maximum: 0.35
    nominal: 0.25  # HACK, as corner pads are too close otherwise
  pad_overrides:
  # Bottom (short)
    7:
      size_increase: [null, -0.075]
      move: [null, 0.0375]
    10:
      size_increase: [null, -0.075]
      move: [null, 0.0375]
      # Top (short)
    17:
      size_increase: [null, -0.075]
      move: [null, -0.0375]
    20:
      size_increase: [null, -0.075]
      move: [null, -0.0375]
      # Top (long)
    19:
      size_increase: [null, 0.10]
      move: [null, 0.05]

