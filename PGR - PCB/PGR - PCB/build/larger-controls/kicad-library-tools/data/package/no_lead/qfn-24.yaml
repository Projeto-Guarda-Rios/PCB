# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

QFN-24-1EP_3x3mm_P0.4mm_EP1.75x1.6mm:
  size_source:
    url: 'https://www.invensense.com/wp-content/uploads/2015/02/PS-MPU-9250A-01-v1.1.pdf'
    page: 39
  device_type: 'QFN'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 2.9
    nominal: 3
    maximum: 3.1
  body_size_y:
    minimum: 2.9
    nominal: 3
    maximum: 3.1
  overall_height:
    minimum: 0.95
    nominal: 1
    maximum: 1.05
  num_pins_x: 6
  num_pins_y: 6
  pitch: 0.4
  lead_width:
    minimum: 0.15
    nominal: 0.2
    maximum: 0.25
  lead_len:
    minimum: 0.25
    nominal: 0.3
    maximum: 0.35

    # Chosen for backwards compatibility
  chamfer_edge_pins: 0.12
  EP_size_x:
    minimum: 1.65
    nominal: 1.7
    maximum: 1.75
  EP_size_y:
    minimum: 1.49
    nominal: 1.54
    maximum: 1.59
  EP_size_x_overwrite: 1.75
  EP_size_y_overwrite: 1.6
  EP_num_paste_pads: [2, 2]
  thermal_vias:
    count: [2, 2]
    drill: 0.2
    EP_paste_coverage: 0.75
    paste_via_clearance: 0.1
    paste_avoid_via: False
    paste_between_vias: 2

Texas_QFN-24_RMQ0024A:
# Texas_RMQ0024A_WQFN-24-1EP_3x3mm_P0.4mm_EP1.9x1.9mm
  size_source: 'https://www.ti.com/jp/lit/ml/mpqf398a/mpqf398a.pdf'
  # Example datasheet https://www.ti.com/lit/ds/symlink/dp83825i.pdf
  device_type: 'WQFN'
  manufacturer: 'Texas'
  part_number: 'RMQ0024A'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 2.9
    maximum: 3.1
  body_size_y:
    minimum: 2.9
    maximum: 3.1
  overall_height:
    maximum: 0.8
  num_pins_x: 7
  num_pins_y: 5
  pitch: 0.4
  lead_width:
    minimum: 0.15
    maximum: 0.25
  lead_len: 0.25+0.05-0.1
  pad_overrides:
  #
  # Left row
  #
    1: # Move to make space for wide pad
      move: [null, -0.1]
    2: # Move to make space for wide pad
      move: [null, -0.1]
    3: # Wide pad
      lead_width: 0.35 .. 0.45
      size_increase: [null, 0.2]
    4: # Move to make space for wide pad
      move: [null, 0.1]
    5: # Move to make space for wide pad
      move: [null,  0.1]
      #
      # Bottom row
      #
    6: # Square corner pin
      size_increase: [0.05,  -0.425]
      move: [-0.125, -0.2125]
    7: # Move to make space for wide pad
      move: [-0.1, null]
    8: # Move to make space for wide pad
      move: [-0.1, null]
    9: # Wide pad
      lead_width: 0.35 .. 0.45
      size_increase: [0.2, null]
    10: # Move to make space for wide pad
      move: [0.1, null]
    11: # Move to make space for wide pad
      move: [0.1, null]
    12: # Square corner pin
      size_increase: [0.05,  -0.425]
      move: [0.125, -0.2125]
      #
      # Right row
      #
    17: # Move to make space for wide pad
      move: [null, -0.1]
    16: # Move to make space for wide pad
      move: [null, -0.1]
    15: # Wide pad
      lead_width: 0.35 .. 0.45
      size_increase: [null, 0.2]
    14: # Move to make space for wide pad
      move: [null, 0.1]
    13: # Move to make space for wide pad
      move: [null,  0.1]
      #
      # Top row
      #
    24: # Square corner pin
      size_increase: [0.05,  -0.425]
      move: [-0.125, 0.2125]
    23: # Move to make space for wide pad
      move: [-0.1, null]
    22: # Move to make space for wide pad
      move: [-0.1, null]
    21: # Wide pad
      lead_width: 0.35 .. 0.45
      size_increase: [0.2, null]
    20: # Move to make space for wide pad
      move: [0.1, null]
    19: # Move to make space for wide pad
      move: [0.1, null]
    18: # Square corner pin
      size_increase: [0.05,  -0.425]
      move: [0.125, 0.2125]
  EP_size_x:
    minimum: 1.8
    nominal: 1.9
    maximum: 2.0
  EP_size_y:
    minimum: 1.8
    nominal: 1.9
    maximum: 2.0
  EP_num_paste_pads: [1, 1]
  thermal_vias:
    count: [2, 2]
    drill: 0.2
    EP_paste_coverage: 0.81 # From datasheet
    paste_via_clearance: 0.1
    paste_avoid_via: False

Texas_RRW0024A_WQFN-24-1EP_3x3mm_P0.4mm_EP1.9x1.9mm:
  size_source:
    - url: 'Texas RRW0024A'
    - url: 'https://www.ti.com/lit/ml/mpqf657a/mpqf657a.pdf'
    - url: 'https://www.ti.com/lit/ds/symlink/drv8311.pdf'
      page: 91
  device_type: 'WQFN'
  manufacturer: 'Texas'
  part_number: 'RRW0024A'
  ipc_class: 'qfn'
  body_size_x: 2.9 .. 3.1
  body_size_y: 2.9 .. 3.1
  overall_height: 0.7 .. 0.8
  body_pcb_gap: 0.00 .. 0.05
  num_pins_x: 5
  num_pins_y: 7
  pitch: 0.4
  lead_width: 0.15 .. 0.25
  lead_len: 0.17 .. 0.37
  lead_height: 0.1
  # land pattern overrides from Texas, necessary to get 0.20 mm clearance between pads 12 & 13, 19 & 20:
  pad_length: 0.47
  pad_width: 0.20
  pad_center_to_center_x: 2.93
  pad_center_to_center_y: 2.93
  pad_overrides:
    8: &move_in_x # .yaml anchor, we will use same value here in others pins
      move: [+0.13, null]
    9: *move_in_x # .yaml alias, used to refer to the anchor
    10: *move_in_x
    11: *move_in_x
    12: *move_in_x
    20: *move_in_x
    21: *move_in_x
    22: *move_in_x
    23: *move_in_x
    24: *move_in_x
  EP_size_x:
    minimum: 1.85
    maximum: 1.95
  EP_size_y:
    minimum: 1.85
    maximum: 1.95
  EP_num_paste_pads: [2, 2]
  thermal_vias:
    count: [3, 3]
    grid: [0.7, 0.7]
    drill: 0.2
    remove_corner_vias: True # Texas suggests 5 vias in cross shape

