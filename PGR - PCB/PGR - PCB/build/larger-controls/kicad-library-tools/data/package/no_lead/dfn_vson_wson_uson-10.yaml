Diodes_UDFN-10_1x2.5mm_P0.5mm:
  library: Package_DFN_QFN # TEMPORARY
  size_source: 'https://www.diodes.com/assets/Package-Files/U-DFN2510-10-Type-CJ.pdf'
  device_type: 'UDFN'
  manufacturer: 'Diodes'
  additional_tags:
    - Diodes_CJ
    - Diodes_U-DFN2510-10
  body_size_x: # Dim "E"
    minimum: 0.950
    nominal: 1.000
    maximum: 1.075
  body_size_y: # Dim "D"
    minimum: 2.450
    nominal: 2.500 # technically not specified in the datasheet, but avg of min/max and consistent with package naming
    maximum: 2.575
  overall_height: # Dim "A"
    minimum: 0.545
    maximum: 0.605
  # This section is to make the land pattern match the recommended land
  # (see size_source link)
  pad_width: 0.25 # Instead of IPC 0.2mn
  pad_length: 0.625 # Instead of IPC 0.8mn
  pad_center_to_center_x: 0.775 # Y3-Y

  num_pins_x: 0
  num_pins_y: 5
  pitch: 0.5
  lead_width: # Dim "b"
    minimum: 0.150
    maximum: 0.250
  lead_len: # Dim "L"
     minimum: 0.350
     maximum: 0.450
  pad_overrides:
    3: # Larger pin 3
      size: [0.7, 0.45] # Y1xX1
      move: [0.0375, null]
    8: # Smaller pin 8
      size: [0.575, 0.45] # Y5xX1
      move: [0.025, null]

