  # violate DRC for most boards.
  # With the reduction, the resulting pad geometry is quite similar to the datasheet
  # and we have 0.2mm clearance which is also the IPC default minimum clearance.
  # This also means that in MaximumMaterialCondition the leads are bigger than
  # the pads. But that is something the user has to live with

