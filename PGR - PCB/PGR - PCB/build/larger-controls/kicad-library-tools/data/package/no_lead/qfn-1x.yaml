# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

UQFN-10_1.3x1.8mm_P0.4mm:
  size_source: 'http://ww1.microchip.com/downloads/en/DeviceDoc/00001725D.pdf (Page 9)'
  device_type: 'UQFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 1.3
    tolerance: 0
  body_size_y:
    nominal: 1.8
    tolerance: 0
  num_pins_x: 3
  num_pins_y: 2
  pitch: 0.4
  lead_width:
    minimum: 0.15
    maximum: 0.25
  lead_len_V:
    minimum: 0.35
    maximum: 0.45
  lead_len_H:
    minimum: 0.45
    maximum: 0.55
  heel_reduction: 0.05 #fnecessary to reach 0.2mm clearance between vertical and horizontal pads

UQFN-10_1.4x1.8mm_P0.4mm:
  size_source: 'https://www.onsemi.com/pub/Collateral/488AT.PDF'
  compatible_mpns:
    - 'ONSemi-UQFN10-488AT-01' # e.g. NL3S22S
  device_type: 'UQFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 1.4
    tolerance: 0
  body_size_y:
    nominal: 1.8
    tolerance: 0
  num_pins_x: 3
  num_pins_y: 2
  pitch: 0.4
  lead_width:
    minimum: 0.15
    maximum: 0.25
  lead_len_V:
    minimum: 0.3
    maximum: 0.5
  lead_len_H:
    minimum: 0.3
    maximum: 0.5
  heel_reduction: 0.05 # necessary to reach 0.15mm clearance between vertical and horizontal pads
  pad_overrides:
    1:
      lead_len: 0.4 .. 0.6
      size_increase: [0.2, null] # 0.2mm wider than standard pins
      move: [0.1, null] # Move inside (half of size increase)

Texas_RSW0010A_UQFN-10_1.4x1.8mm_P0.4mm:
# height = 0.45 .. 0.55 mm, similar to JEDEC MO-288 variation UDEE
