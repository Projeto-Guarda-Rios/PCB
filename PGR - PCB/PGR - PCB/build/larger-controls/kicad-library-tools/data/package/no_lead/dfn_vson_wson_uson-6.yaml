MPS_VSON-6_1x1.5mm_P0.5mm:
# VSON / VDFN package (height = 0.80 .. 1.00)
  size_source:
    url: 'https://www.monolithicpower.com/en/documentview/productdocument/index/version/2/document_type/Datasheet/lang/en/sku/MP21148/document_id/1006/'
    page: 14
  device_type: 'VSON'
  manufacturer: 'MPS' # manufacturer prefix is needed due to non-standard lead count (if you compare to JEDEC MO-229 variant V1510D)
  ipc_class: 'qfn'
  body_size_x: 0.90 .. 1.10 # nominal 1.00
  body_size_y: 1.40 .. 1.60 # nominal 1.50
  overall_height:
    minimum: 0.80
    maximum: 1.00
  num_pins_x: 0
  num_pins_y: 3
  pitch: 0.50
  lead_width:
    minimum: 0.20
    maximum: 0.30
  lead_len:
    minimum: 0.20 #Hack to get a footprint similar to manufacturer's recommended land pattern. Real value is 0.30.
    maximum: 0.35 #Hack to get a footprint similar to manufacturer's recommended land pattern. Real value is 0.40.
  pad_overrides:
    1:
      size_increase: [0.05, null]
      move: [0.025, null] # moving to the right, exactly 0.05/2

MPS_USON-6_1.2x1.6mm_P0.5mm:
# USON / UDFN package (height = 0.50 .. 0.60)
  size_source:
    url: 'https://www.monolithicpower.com/en/documentview/productdocument/index/version/2/document_type/Datasheet/lang/en/sku/MP2151/document_id/4678/'
    page: 21
  device_type: 'USON'
  manufacturer: 'MPS' # manufacturer prefix is needed due to non-standard D/E size (if you compare to JEDEC MO-229)
  ipc_class: 'qfn'
  body_size_x: 1.10 .. 1.30 # nominal 1.20
  body_size_y: 1.50 .. 1.70 # nominal 1.60
  overall_height:
    minimum: 0.50
    maximum: 0.60
  num_pins_x: 0
  num_pins_y: 3
  pitch: 0.50
  lead_width:
    minimum: 0.20
    maximum: 0.30
  lead_len:
    minimum: 0.20 #Hack to get a footprint similar to manufacturer's recommended land pattern. Real value is 0.30.
    maximum: 0.35 #Hack to get a footprint similar to manufacturer's recommended land pattern. Real value is 0.40.
  pad_overrides:
    1:
    #lead_len: 0.40 .. 0.50 # IT'S NOT WORKING
      size_increase: [0.10, null]
      move: [0.05, null] # moving to the right, exactly 0.10/2

