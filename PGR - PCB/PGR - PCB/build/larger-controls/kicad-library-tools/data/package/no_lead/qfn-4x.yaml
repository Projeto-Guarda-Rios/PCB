# Documentation: https://gitlab.com/groups/kicad/libraries/-/wikis/Footprint-Generators/No-lead

# QFN - Quad Flat No-lead
#
# Some standards:
# - JEDEC MO-220, MO-248
# - JEITA ED-7311-22, ED-7324

default_parameters:
  library: Package_DFN_QFN

VQFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm:
  size_source: 'JEDEC MO-220-K.01, variation VHHE-1, https://www.jedec.org/system/files/docs/MO-220K01.pdf'
  device_type: 'VQFN'
  ipc_class: 'qfn'
  body_size_x: 4.90 .. 5.00 .. 5.10
  body_size_y: 4.90 .. 5.00 .. 5.10
  overall_height: 0.80 .. 0.90 .. 1.00
  num_pins_x: 10
  num_pins_y: 10
  pitch: 0.4
  lead_width: 0.15 .. 0.20 .. 0.25
  lead_len: 0.30 .. 0.40 .. 0.50
  EP_size_x: 3.45 .. 3.60 .. 3.75
  EP_size_y: 3.45 .. 3.60 .. 3.75
  EP_num_paste_pads: [2, 2]
  thermal_vias:
    count: [4, 4]
    grid: [0.9, 0.9] # https://www.infineon.com/dgdl/Infineon-AN72845_Design_Guidelines_For_Infineon_Quad_Flat_No_Lead_(QFN)_Packaged_Devices-ApplicationNotes-v04_00-EN.pdf?fileId=8ac78c8c7cdc391c017d0735936858e5#page=6
    drill: 0.2
    EP_paste_coverage: 0.75 # compensate the paste on the vias
    paste_via_clearance: 0.1
    paste_avoid_via: False

VQFN-40-1EP_5x5mm_P0.4mm_EP3.7x3.7mm:
# Like JEDEC MO-220-K.01 VHHE-1, but different EP and overall_height
# Silabs states that it's based on VKKD-4, but it's likely a typo (that variation is 7x7mm, 48 pins, pitch 0.5mm)
  inherit: VQFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm
  size_source:
    - url: 'Based on JEDEC MO-220-K.01, variation VHHE-1'
    - url: 'https://www.silabs.com/documents/public/data-sheets/efm32pg23-datasheet.pdf'
      page: 89
    - url: 'https://www.jedec.org/system/files/docs/MO-220K01.pdf'
  overall_height: 0.80 .. 0.85 .. 0.90
  EP_size_x: 3.55 .. 3.70 .. 3.85
  EP_size_y: 3.55 .. 3.70 .. 3.85

VQFN-40-1EP_5x5mm_P0.4mm_EP3.5x3.5mm:
  inherit: VQFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm
  size_source: 'Based on JEDEC MO-220-K.01, variation VHHE-1, https://www.monolithicpower.com/en/documentview/productdocument/index/version/2/document_type/Datasheet/lang/en/sku/MP6536/document_id/3761/'
  lead_len: 0.35 .. 0.45
  EP_size_x: 3.20 .. 3.50 .. 3.50 # see land pattern in datasheet
  EP_size_y: 3.20 .. 3.50 .. 3.50

VQFN-40-1EP_5x5mm_P0.4mm_EP3.3x3.3mm:
# Like JEDEC MO-220-K.01 VHHE-1, however EP is smaller (3.3x3.3mm instead of 3.6x3.6mm)
  inherit: VQFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm
  size_source:
    - url: 'Based on JEDEC MO-220-K.01, variation VHHE-1'
    - url: 'https://tridentiot.com/wp-content/uploads/2024/11/DS-ZW-0001-01-T32CZ20-Datasheet.pdf'
      page: 36
  overall_height: 0.80 .. 0.85 .. 0.90
  lead_len: 0.35 .. 0.4 .. 0.45
  EP_size_x: 3.25 .. 3.30 .. 3.35
  EP_size_y: 3.25 .. 3.30 .. 3.35

TQFN-40-1EP_5x5mm_P0.40mm_EP3.50x3.50mm:
# This is a WQFN, similar to JEDEC MO-220-K.01, variation WHHE-1, standard has EP = 3.45..3.60..3.75
# We should merge this footprint with QFN-40-1EP_5x5mm_P0.4mm_EP3.6x3.6mm below,
# since Maxim / Analog Devices land pattern recommendation is EP3.6x3.6, see https://www.analog.com/media/en/package-pcb-resources/land-pattern/tqfn/90-0016.pdf
# Only MAX32670GTL is using it, seach for 21-0140 and 90-0016 in https://www.analog.com/media/en/technical-documentation/data-sheets/max32670-max32671.pdf
  size_source: 'https://pdfserv.maximintegrated.com/package_dwgs/21-0140.PDF (T4055-1)'
  device_type: 'TQFN'
  ipc_class: 'qfn'
  body_size_x:
    nominal: 5
  body_size_y:
    nominal: 5
  overall_height:
    minimum: 0.7
    nominal: 0.75
    maximum: 0.8
  num_pins_x: 10
  num_pins_y: 10
  pitch: 0.40
  lead_width:
    minimum: 0.15
    nominal: 0.20
    maximum: 0.25
  lead_len:
    minimum: 0.30
    nominal: 0.40
    maximum: 0.50
  chamfer_edge_pins: 0.12
  EP_size_x:
    minimum: 3.40
    nominal: 3.50
    maximum: 3.60
  EP_size_y:
    minimum: 3.40
    nominal: 3.50
    maximum: 3.60
  EP_num_paste_pads: [2, 2]
  thermal_vias:
    count: [3, 3]
    drill: 0.2
    EP_paste_coverage: 0.75
    paste_via_clearance: 0.1
    paste_avoid_via: False

