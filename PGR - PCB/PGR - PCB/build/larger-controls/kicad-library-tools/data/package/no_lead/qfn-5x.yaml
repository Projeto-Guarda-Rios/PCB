VQFN-56-1EP_8x8mm_P0.5mm_EP5.5x5.06mm:
  size_source: 'https://www.nxp.com/docs/en/package-information/SOT684-21_DD_SC.pdf'
  compatible_mpns:
    - 'NXP_SOT684-21(DD/SC)'
    - 'NXP_HVQFN-56-1EP_8x8mm_P0.5mm_EP5.5x5.06mm'
    - 'NXP_98ASA01086D' # step-cut WF-type
  device_type: 'VQFN'
  ipc_class: 'qfn'
  body_size_x: 8.0
  body_size_y: 8.0
  overall_height:
    minimum: 0.8
    nominal: 0.85
    maximum: 1
  num_pins_x: 14
  num_pins_y: 14
  pitch: 0.5
  lead_width:
    minimum: 0.2
    nominal: 0.25
    maximum: 0.3
  lead_len:
    minimum: 0.35
    nominal: 0.45
    maximum: 0.55
  EP_size_x:
  # Datasheet has conflicting values for EP!
  # page 2: [5.00 - 5.20] x [4.86 x 5.06]
  # - this is actually the dimensions of the non-(DD/SC) variant...
  # page 4: [5.26 - 5.46] x [4.76 - 4.96]
  # page 6:  5.5 nominal  x  5.06 nominal
  # - I used this one
  # - Since there's no min/max values, but everything else was +/- 0.1 mm,
  #   that's what I used here too...
    minimum: 5.4
    maximum: 5.6
  EP_size_y:
    minimum: 4.96
    maximum: 5.16
  EP_num_paste_pads: [3, 3]
  thermal_vias:
    count: [5, 5]
    drill: 0.2
    EP_paste_coverage: 0.6
    paste_via_clearance: 0.1

