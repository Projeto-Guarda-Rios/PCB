QFN-56-1EP_8x8mm_P0.5mm_EP6.1x6.1mm:
# Used by Intan RHD2000 parts
# See also ChipQuik IPC0031 adapter/stencil.
# Intan diagram doesn't contain tolerances, so, where different, use JEDEC standard
# M0-220 most similar variant VLLD-2: 0.8mm height, 8x8mm, 0.5mm pitch, see Table 8H
  size_source:
    url: 'http://intantech.com/files/Intan_RHD2000_series_datasheet.pdf'
    page: 38
  device_type: 'QFN'
  ipc_class: 'qfn'
  body_size_x: # MO-220 dimension D
    nominal: 8.00
    tolerance: 0.15 # tol. aaa
  body_size_y: # MO-220 dimension E
    nominal: 8.00
    tolerance: 0.15 # tol. aaa
  overall_height:
    nominal: 0.85 # Different to MO-220 dim A
    tolerance: 0.1 # Inferred from Table 2 for "V" class
  num_pins_x: 14
  num_pins_y: 14
  pitch: 0.5
  lead_width: # MO-220 dimension b
  # -0.07/+0.05 tol. inferred from Table 3
  # combined with the 0.23 nominal from the DS
    minimum: 0.16
    nominal: 0.23
    maximum: 0.28
  lead_len: # MO-220 dimension L, Table 8H
    minimum: 0.3
    nominal: 0.4
    maximum: 0.5
  EP_size_x:
  # EP: MO-220 dimension D2, E2
  # MO-220 doesn't give an exact size, but the tolerance is
  # class fff = 0.1 for 0.5mm pitch
    nominal: 6.1
    tolerance: 0.1
  EP_size_y:
    nominal: 6.1
    tolerance: 0.1
  EP_num_paste_pads: [4, 4]
  thermal_vias:
    count: [5, 5]
    drill: 0.2
    EP_paste_coverage: 0.6
    paste_via_clearance: 0.1

