default_parameters:
  manufacturer: Wuerth
  library_name: Inductor_SMD

series_HCI:
  default_parameters:
    datasheet: "https://www.we-online.com/en/components/products/WE-HCI"
    # There are two 1890 series, the only difference is the lead width
    # (4.2 and 3.2mm). FPs are the same. Include the wider one.
    3d:
      type: 2
      bodyColor: dark grey body
      pinColor: metal grey pins
      padThickness: 0.05
    tags:
      - flat-wire
      - shielded
      - Würth
      - SMT
  csv: Wuerth_hci.csv

