# SMD Straight(Vertical) logic:
SMD-1row_Straight_Right:
  inherit: defaults_PS_SMD_1Row_Vertical
  pin1_left: False
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  1.5
    height: 2.25 # not used for straight footprint
    offset: 0.0
    overlength: 0.5
  pins:
    # pp: 2.9 # pin-pin width aka W aka E, for reference only.
    width:  0.3
    #thick: 0.1
    drill:  0
    offset: 0.0 # not specified, minimum pins_width/2 = 0.3/2
    smd_length: 1.45
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (2.90 - 0)/2 - 0 = 1.45
  pads:
    # pp: 3.9 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 1.95
    width:  0.5
    offset: 0.975
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (3.9 - 0 - 1.95)/2 = 0.975
  datasheet: https://gct.co/files/drawings/bc070.pdf

SMD-1row_Straight_Left:
  inherit: SMD-1row_Straight_Right
  pin1_left: True

SMD-2row_Straight_Right:
  inherit: defaults_PS_SMD_2Row_Vertical
  pin1_left: False
  row_count: 2
  pos_range:
    range: [2, 40]
  body:
    width:  2.5
    height: 2.25
    offset: 0.0
    overlength: 0.5
  pins:
    # pp: 3.9 # pin-pin width aka W aka E, for reference only.
    width:  0.3
    # thick: 0.1
    drill:  0
    offset: 0.0 # not specified, minimum (pins_width*2 + pitch)/2 = 1.6/2
    smd_length: 1.45
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (3.9 - 1.0)/2 - 0 = 1.45
  pads:
    # pp_width: 4.9 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 1.85
    width:  0.5
    offset: 1.025
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (4.9 - 1.0 - 1.85)/2 = 1.025
  datasheet: https://gct.co/files/drawings/bc085.pdf

# 1.00mm Socket SMD-1row_Angled: https://gct.co/files/drawings/bc075.pdf
