# Useful source: https://gct.co/board-to-board-connector/list?pitch=2.54mm&locatingpeg=without+locating+peg&elevated=No
defaults_PH_THT_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_{orientation}"
  descr_format: '{mount_text} straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: THT
  mount_text: Through hole
  orientation: Vertical
  pin_pitch: 2.54

defaults_PH_THT_Horizontal:
  inherit: defaults_PH_THT_Vertical
  descr_format: '{mount_text} angled {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch, {pins_length:g}mm pin length{row_text}'
  tags_base: '{mount_text} angled {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: THT
  orientation: Horizontal

defaults_PH_SMD_1Row_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_Vertical_SMD{pin1_text}"
  descr_format: 'surface-mounted straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}{pin1_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}{pin1_text}'
  mount_type: SMD
  mount_text: Surface mounted
  orientation: Vertical
  pin_pitch: 2.54

defaults_PH_SMD_2Row_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_Vertical_SMD"
  descr_format: 'surface-mounted straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: SMD
  mount_text: Surface mounted
  orientation: Vertical
  pin_pitch: 2.54


# THT Straight(Vertical) logic:
THT-1row_Straight_Right:
  inherit: defaults_PH_THT_Vertical
  pin1_left: True
  row_count: 1
  pos_range:
    range: [1, 40]
  body:
    width:  2.54
    height: 2.54
    offset: 0.0
    overlength: 0.0
  pins:
    width:  0.64
    drill:  1.0
    offset: 0.0
    length: 6.0
  pads:
    length: 1.7
    width:  1.7
    offset: 0
  datasheet: https://www.we-online.com/components/products/datasheet/6130xx11121.pdf

THT-2row_Straight_Right:
  inherit: THT-1row_Straight_Right
  row_count: 2
  body:
    width: 5.08
  datasheet: https://www.we-online.com/components/products/datasheet/6130xx21121.pdf


# THT Angled(Horizontal) logic:
THT-1row_Angled_Right:
  inherit: defaults_PH_THT_Horizontal
  pin1_left: True
  row_count: 1
  pos_range:
    range: [1, 40]
  body:
    width:  2.54
    height: 2.54
    offset: 1.5
    overlength: 0.0
  pins:
    width:  0.64
    drill:  1.0
    offset: 0.0
    length: 6.0
  pads:
    length: 1.7
    width:  1.7
    offset: 0
  datasheet: https://www.we-online.com/components/products/datasheet/6130xx11021.pdf

THT-2row_Angled_Right:
  inherit: THT-1row_Angled_Right
  row_count: 2
  datasheet: https://www.we-online.com/components/products/datasheet/6130xx21021.pdf


# SMD Straight(Vertical) logic:
SMD-1row_Straight_Left:
  inherit: defaults_PH_SMD_1Row_Vertical
  pin1_left: True
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  2.54
    height: 2.54
    offset: 0.0
    overlength: 0.0
  pins:
    # pp: 5.3 # pin-pin width aka W aka E, for reference only.
    width:  0.64
    drill:  0.0
    offset: 0.0
    length: 6.0
    smd_length: 2.54
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (5.3 - 0)/2 - 0 = 2.65
  pads:
    # pp: 6.3 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 2.51 # 3.15
    width:  1.0
    offset: 1.655
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (6.3 - 0 - 3.15)/2 = 1.575
  datasheet: https://cdn.harwin.com/pdfs/M20-877.pdf
  # https://gct.co/files/drawings/bg055.pdf

SMD-1row_Straight_Right:
  inherit: SMD-1row_Straight_Left
  pin1_left: False

SMD-2row_Straight_Left:
  inherit: defaults_PH_SMD_2Row_Vertical
  pin1_left: True
  row_count: 2
  pos_range:
    range: [1, 40]
    # 2x01 is only handsolder though because it will not stay upright during reflow/wave.
  body:
    width:  5.08
    height: 2.54
    offset: 0.0
    overlength: 0.0
  pins:
    # pp: 7.38 # pin-pin width aka W aka E, for reference only.
    width:  0.64
    drill:  0.0
    offset: 0.0
    length: 6.0
    smd_length: 2.33
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (7.38 - 2.54)/2 - 0 = 2.42
  pads:
    # pp_width: 8.38 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 3.15 # 3.18
    width:  1.0
    offset: 1.255
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (8.38 - 2.54 - 3.18)/2 = 1.33
  datasheet: https://cdn.harwin.com/pdfs/M20-876.pdf
  # https://gct.co/files/drawings/bg050.pdf

# 2.54mm Header SMD-1row_Angled: https://gct.co/files/drawings/bg080.pdf
# 2.54mm Header SMD-2row_Angled: https://gct.co/files/drawings/bg065.pdf
