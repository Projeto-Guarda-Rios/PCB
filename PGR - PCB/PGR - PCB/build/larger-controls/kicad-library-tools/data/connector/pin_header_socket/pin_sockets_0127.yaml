# SMD Straight(Vertical) logic:
SMD-1row_Straight_Right:
  inherit: defaults_PS_SMD_1Row_Vertical
  pin1_left: False
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  1.8
    height: 4.6
    offset: 0.0
    overlength: 0.35
  pins:
    # pp: 3.5 # pin-pin width aka W aka E, for reference only.
    width:  0.42
    #thick:  0.15
    drill:  0
    offset: 0.0 # not specified, minimum pins_width/2 = 0.4/2
    smd_length: 1.75
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (3.50 - 0)/2 - 0 = 1.75
  pads:
    # pp: 4.5 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 1.8
    width:  0.65
    offset: 1.35
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (4.5 - 0 - 1.8)/2 = 1.35
  datasheet: https://gct.co/files/drawings/bd075.pdf

SMD-1row_Straight_Left:
  inherit: SMD-1row_Straight_Right
  pin1_left: True

SMD-2row_Straight_Right:
  inherit: defaults_PS_SMD_2Row_Vertical
  pin1_left: False
  row_count: 2
  pos_range:
    range: [1, 40]
  body:
    width:  2.54
    height: 4.6
    offset: 0.0
    overlength: 0.0
  pins:
    # pp: 5.11, bd064: 4.8 # pin-pin width aka W aka E, for reference only.
    width:  0.4 # 0.42
    #thick:  0.15
    drill:  0
    offset: 0.0 # not specified, minimum (pins_width + pitch)/2 = 1.68/2
    smd_length: 1.92
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (5.11 - 1.27)/2 - 0 = 1.92,  (4.8 - 1.27)/2 - 0 = 1.765
  pads:
    # pp_width: 5.8 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 2.1
    width:  0.75 # 0.65
    offset: 1.165
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (5.7 - 1.27 - 2.1)/2 = 1.165, (5.8 - 1.27 - 2.1)/2 = 1.215
  datasheet: from Kicad 4.0.7!
  # https://gct.co/files/drawings/bd064.pdf

# 1.27mm Socket SMD-2row_Angled: https://gct.co/files/drawings/bd093.pdf
