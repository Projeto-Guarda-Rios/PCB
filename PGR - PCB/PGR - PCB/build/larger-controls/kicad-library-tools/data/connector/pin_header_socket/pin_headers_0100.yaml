# Useful source: https://gct.co/board-to-board-connector/list?pitch=1.00mm&locatingpeg=without+locating+peg&elevated=No
defaults_PH_THT_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_{orientation}"
  descr_format: '{mount_text} straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: THT
  mount_text: Through hole
  orientation: Vertical
  pin_pitch: 1.00

defaults_PH_THT_Horizontal:
  inherit: defaults_PH_THT_Vertical
  descr_format: '{mount_text} angled {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch, {pins_length:03.1f}mm pin length{row_text}'
  tags_base: '{mount_text} angled {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: THT
  orientation: Horizontal

defaults_PH_SMD_1Row_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_Vertical_SMD{pin1_text}"
  descr_format: 'surface-mounted straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}{pin1_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}{pin1_text}'
  mount_type: SMD
  mount_text: Surface mounted
  orientation: Vertical
  pin_pitch: 1.00

defaults_PH_SMD_2Row_Vertical:
  lib_format: 'Connector_PinHeader_{pin_pitch:03.2f}mm'
  class_name: PinHeader
  class_descr: pin header
  footpr_format: "{class_name}_{row_count}x{pos_count:02}_P{pin_pitch:03.2f}mm_Vertical_SMD"
  descr_format: 'surface-mounted straight {class_descr}, {row_count}x{pos_count:02}, {pin_pitch:03.2f}mm pitch{row_text}'
  tags_base: '{mount_text} {class_descr} {mount_type} {row_count}x{pos_count:02} {pin_pitch:03.2f}mm{row_text}'
  mount_type: SMD
  mount_text: Surface mounted
  orientation: Vertical
  pin_pitch: 1.00


# THT Straight(Vertical) logic:
THT-1row_Straight_Right:
  inherit: defaults_PH_THT_Vertical
  pin1_left: True
  row_count: 1
  pos_range:
    range: [1, 40]
  body:
    width:  1.27
    height: 1.0
    offset: 0.0
    overlength: 0.0
  pins:
    width:  0.3
    drill:  0.5
    offset: 0.0
    length: 2.0
  pads:
    length: 0.85
    width:  0.85
    offset: 0
  datasheet: https://gct.co/files/drawings/bc020.pdf

THT-2row_Straight_Right:
  inherit: THT-1row_Straight_Right
  row_count: 2
  body:
    width: 2.3
  datasheet: https://gct.co/files/drawings/bc035.pdf


# THT Angled(Horizontal) logic:
THT-1row_Angled_Right:
  inherit: defaults_PH_THT_Horizontal
  pin1_left: True
  row_count: 1
  pos_range:
    range: [1, 40]
  body:
    width:  1.0
    height: 1.27
    offset: 0.25
    overlength: 0.0
  pins:
    width:  0.3
    drill:  0.5
    offset: 0.0
    length: 2.0
  pads:
    length: 0.85
    width:  0.85
    offset: 0
  datasheet: https://gct.co/files/drawings/bc030.pdf

THT-2row_Angled_Right:
  inherit: THT-1row_Angled_Right
  row_count: 2
  body:
    width:  1.2
    offset: 0.9
  datasheet: https://gct.co/files/drawings/bc045.pdf


# SMD Straight(Vertical) logic:
SMD-1row_Straight_Left:
  inherit: defaults_PH_SMD_1Row_Vertical
  pin1_left: True
  row_count: 1
  pos_range:
    range: [2, 40]
  body:
    width:  1.27
    height: 1.0
    offset: 0.0
    overlength: 0.0
  pins:
    # pp: 2.5 # pin-pin width aka W aka E, for reference only.
    width:  0.3
    drill:  0.0
    offset: 0.0
    length: 2.0
    smd_length: 1.25
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (2.50 - 0)/2 - 0 = 1.25
  pads:
    # pp: 3.5 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 1.75
    width:  0.6
    offset: 0.875
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (3.5 - 0 - 1.75)/2 = 0.875
  datasheet: https://gct.co/files/drawings/bc032.pdf

SMD-1row_Straight_Right:
  inherit: SMD-1row_Straight_Left
  pin1_left: False

SMD-2row_Straight_Left:
  inherit: defaults_PH_SMD_2Row_Vertical
  pin1_left: True
  row_count: 2
  pos_range:
    range: [1, 40]
    # 2x01 is only handsolder though because it will not stay upright during reflow/wave.
  body:
    width:  2.3 # Datasheet: 3.1, Multicomp 3.15
    height: 1.0
    offset: 0.0
    overlength: 0.0
  pins:
    # pp: 4.8 # pin-pin width aka W aka E, for reference only.
    width:  0.3
    drill:  0.0
    offset: 0.0
    length: 2.0
    smd_length: 1.9
    # smd_length from pins_pp: (pins_pp - (rows-1)*pitch)/2 - pins_offset =
    # (4.8 - 1.0)/2 - 0 = 1.9
  pads:
    # pp_width: 5.8 # pad-pad width aka W+1 aka E+1, offset is preferred.
    length: 2.0 # Datasheet: 2.55
    width:  0.5
    offset: 1.15 # Datasheet: 1.125
    # pads_offset smd from pads_pp: (pads_pp - (rows-1)*pitch - pads_length)/2 =
    # (5.8 - 1.0 - 2.55)/2 = 1.125
  datasheet: https://gct.co/files/drawings/bc050.pdf
  # https://4donline.ihs.com/images/VipMasterIC/IC/SCMP/SCMP-S-A0013458063/SCMP-S-A0013458151-1.pdf?hkey=6D3A4C79FDBF58556ACFDE234799DDF0

# 1.00mm Header SMD-1row_Angled: https://gct.co/files/drawings/bc034.pdf
# 1.00mm Header SMD-2row_Angled: https://gct.co/files/drawings/bc057.pdf
